name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure git credentials
          git config --global user.email "552003Aditya@gmail.com"
          git config --global user.name "Aditya Sharma"
          
          # Add Hugging Face Space as a remote
          git remote add hf https://DSAditya552003:$HF_TOKEN@huggingface.co/spaces/DSAditya552003/emosense-ai
          
          # Fetch and pull remote changes from Hugging Face Space (preserving browser-uploaded models)
          # using ours strategy to prefer local code changes in case of conflict on code files
          # Check if 'main' branch exists on the remote Hugging Face Space
          if git ls-remote --exit-code --heads hf main; then
            echo "Remote branch 'main' exists. Fetching and merging..."
            git fetch hf main
            git checkout -b temp-sync
            git merge -s ours hf/main --allow-unrelated-histories -m "Merge remote changes from HF Space"
            git push hf temp-sync:main
          else
            echo "Remote branch 'main' does not exist (empty Space). Pushing directly..."
            git push hf main
          fi
